#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
kotlin.native.ignoreDisabledTargets=true

#Gradle
# Memory is bounded deliberately: this machine has 16 GB and may run other Gradle builds
# concurrently. Raising these risks swap/OOM rather than speed. See docs/dev/BUILDLOG.md.
org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=768M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=4

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#SatRide structural build config.
# Convention plugins in build-logic read these; dependency versions live in
# gradle/libs.versions.toml. Keep the split — do not duplicate values across the two.
satride.android.compileSdk=37
satride.android.minSdk=26
satride.android.targetSdk=36
satride.jvmTarget=17
satride.namespace=com.developerstring.satride

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
